<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Fylo Data Storage</title>
</head>
<body>
  <main>
    <section>
      <div>
        <div><img src="./images/logo.svg" alt="Fylo Data Storage Logo" /></div>
        <div class="icon-row">
          <div>
            <img src="./images/icon-document.svg" alt="View Documents">
          </div>
          <div>
            <img src="./images/icon-folder.svg" alt="View Folders">
          </div>
          <div>
            <img src="./images/icon-upload.svg" alt="Upload File">
          </div>
        </div>
      </div>
    </section>
    <section>
      <p class="storage-info">You’ve used <span class="storage-unit">815 GB</span> of your storage</p>
      <div class="progress-bar-container">
        <div class="progress-bar-inner">
          <div class="progress-bar-marker"></div>
        </div>
      </div>
      <div class="storage-unit-range">
        <span class="storage-unit">0 GB</span>
        <span class="storage-unit">1000 GB</span>
      </div>
      <div class="storage-left">
        <h3>185</h3>
        <span>GB left</span>
      </div>
    </section>
  </main>
</body>
</html>
